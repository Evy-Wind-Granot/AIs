[flake8]
max-line-length = 100
# Generated/vendored copies of earlier revisions are kept for A/B comparison
# and are deliberately not linted.
exclude = .git,__pycache__,venv,venv_moirai,orig_magnetometer_demo.py

[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
# The pipeline mutates module-level settings from config, so full strictness
# would require a settings object; these checks are the useful subset today.
check_untyped_defs = False
exclude = orig_magnetometer_demo\.py$
