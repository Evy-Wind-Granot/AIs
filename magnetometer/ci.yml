name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m flake8 .

      - name: Type check
        run: |
          python -m mypy magnetometer/demos/magnetometer_demo.py calibrate_observatory.py \
            calibrate_thresholds.py tune_thresholds.py validate_periods.py \
            magnetometer/tests/test_magnetometer_demo.py

      # Offline unit suites; real upstream-data regression is opt-in and is not
      # run in CI because INTERMAGNET/GFZ/Kyoto availability is external.
      - name: Tests
        run: |
          python magnetometer/tests/test_magnetometer_demo.py
          python magnetometer/models/tests/test_magnetometer_ml.py
          python -m unittest magnetometer/models/tests/test_magnetometer_ml_real.py

      - name: Exit-code contract
        run: |
          set +e
          python magnetometer/demos/magnetometer_demo.py --config does_not_exist.yaml --fetch-real-data
          test $? -eq 4 || { echo "expected EXIT_CONFIG_INVALID (4)"; exit 1; }
          python magnetometer/demos/magnetometer_demo.py
          test $? -eq 1 || { echo "expected EXIT_USAGE (1)"; exit 1; }

      - name: Config file is loadable
        run: |
          python - <<'PY'
          from magnetometer.demos import magnetometer_demo as md
          md.load_config("my_config.yaml")
          print("my_config.yaml validated")
          PY
