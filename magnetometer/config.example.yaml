forecasting:
  enabled: true
  backend: sklearn
  model_root: magnetometer/data/models
  horizons_hours: [1, 3, 6]
  sequence_length: 60
  windows_minutes: [15, 60, 180, 360]
  lags_minutes: [1, 5, 15, 30, 60, 180]
  storm_threshold_nt: 35.0
  regression_loss: absolute_error
  calibration_fraction: 0.15
  final_test_fraction: 0.15
  threshold_min_precision: 0.80
  threshold_max_false_alarm_rate: 0.01
  confidence_floor: 0.55

runtime:
  state_file: .magnetometer_state.json
