[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetometer-pipeline"
version = "2.0.0"
description = "Single-station geomagnetic disturbance pipeline (INTERMAGNET + Kp/Dst)"
readme = "docs/MAGNETOMETER_FORECASTING.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.10,<2",
    "requests>=2.31,<3",
    "PyYAML>=5.4,<7",
]

[project.optional-dependencies]
logging = ["python-json-logger>=2.0,<5"]
dev = ["flake8==7.1.1", "mypy==2.3.0"]

[project.scripts]
magnetometer-pipeline = "magnetometer.demos.magnetometer_demo:main_entry"
magnetometer-calibrate = "magnetometer.calibration.station.calibrate_station:main"

[tool.setuptools]
packages = [
    "magnetometer",
    "magnetometer.models",
    "magnetometer.models.tests",
    "magnetometer.models.tests.unit",
    "magnetometer.models.tests.integration",
    "magnetometer.demos",
    "magnetometer.cli",
    "magnetometer.calibration",
    "magnetometer.calibration.station",
    "magnetometer.calibration.thresholds",
    "magnetometer.calibration.historical",
    "magnetometer.validation",
    "magnetometer.validation.historical",
    "magnetometer.validation.periods",
    "magnetometer.validation.replay",
]
