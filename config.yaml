# Magnetometer Pipeline — Production Configuration
# ================================================
# All tunable parameters live here instead of hardcoded in source.
# Reload without code changes.

# Used when the matching CLI flag is omitted (--observatory/--cadence-s/--column).
observatory:
  default: VIC
  cadence_seconds: 60
  column: x_nt

# ---------------------------------------------------------------------------
# Data Quality Gates
# ---------------------------------------------------------------------------
quality_gates:
  # Minimum fraction of finite samples in analysis period before emitting
  # metrics. Below this: status = insufficient_data, exit code 2.
  min_analysis_coverage: 0.90

  # Maximum fraction of analysis-period samples allowed to fall back to
  # global-median baseline (no real QDC fit). Above this: gate trips.
  max_median_fill_fraction: 0.20

  # Warn if input NaN fraction exceeds this (pre-analysis).
  input_nan_warning_threshold: 0.01

# ---------------------------------------------------------------------------
# Activity Classification Thresholds (nT)
# Calibrated per-observatory. These values are for VIC.
#
# Tiers are scored against the *disturbance amplitude* — the peak-to-peak range
# of the residual over amplitude_window_min — not a single sample's residual,
# so the thresholds are amplitudes and are much larger than the pre-2024
# per-sample values (unsettled 15 / active 35 / minor 40 / major 140).
# ---------------------------------------------------------------------------
thresholds:
  # Rolling window (minutes) behind the amplitude. 0 restores per-sample tiers.
  amplitude_window_min: 180.0

  # range = peak-to-peak, max = largest excursion, instant = per-sample.
  amplitude_mode: range

  # true centers the window on each sample: it then uses *future* data, so only
  # enable it for retrospective re-analysis, never live monitoring.
  amplitude_centered: false

  unsettled: 20.0
  active: 30.0
  minor_storm: 100.0 # calibrated 2024/2021 multi-storm VIC (was 40, per-sample)
  major_storm: 400.0 # calibrated 2024/2021 multi-storm VIC (was 140, per-sample)
  severe_storm: 800.0
  anomaly_jump: 100.0

  # Symmetric physical-implausibility guards (nT).
  # Residuals outside ±this band are flagged "invalid" (sensor fault).
  max_plausible_residual: 3000.0
  min_plausible_residual: -3000.0

# ---------------------------------------------------------------------------
# Baseline Fitting
# ---------------------------------------------------------------------------
baseline:
  # Robust harmonic fit iterations
  n_iterations: 4

  # Outlier down-weighting threshold for baseline fit (nT)
  outlier_threshold_nt: 30.0

  # Window length for QDC fitting (hours)
  window_hours: 24

  # Step size between adjacent windows (hours). 50% overlap = 12h.
  step_hours: 12

  # Max gap samples for linear interpolation before reindexing
  max_gap_samples: 3

  # If storm_frac in a window exceeds this, treat as stormy and extrapolate
  storm_fraction_threshold: 0.05

# ---------------------------------------------------------------------------
# State Persistence
# ---------------------------------------------------------------------------
state:
  # Path to JSON file for persisting last-good QDC coefficients.
  # Enables warm restarts without re-fetching warmup data.
  file: magnetometer/state/.magnetometer_state.json

  # Auto-save state after every successful analysis
  auto_save: true

  # Max age (hours) before discarding stale state and requiring re-warm.
  max_age_hours: 168 # 7 days

# ---------------------------------------------------------------------------
# Output & Alerting
# ---------------------------------------------------------------------------
output:
  # Include full residual/flag arrays in JSON output (can be large)
  include_arrays: false

  # Provenance metadata in every result
  include_provenance: true

alerting:
  # Optional webhook URL to POST on storm detection, a tripped quality gate or
  # a failed health check. Never put a credential here: the pipeline sends
  # `Authorization: Bearer $MAG_ALERT_TOKEN` if that variable is set.
  webhook_url: null

  # Minimum local storm level to trigger webhook (minor_storm, major_storm,
  # severe_storm). Gate/health alerts are sent regardless of this floor.
  webhook_min_level: minor_storm

# ---------------------------------------------------------------------------
# Health checks (reported in `health` in the JSON result and in --metrics-file;
# --fail-on-unhealthy turns a failure into a non-zero exit)
# ---------------------------------------------------------------------------
health:
  # Age of the newest finite sample. Only enforced under --live, where stale
  # data means the monitor is blind rather than merely late.
  max_data_latency_min: 90.0

  # Fraction of the requested window the upstream actually returned.
  min_requested_coverage: 0.80

  # |baseline shift| against the previous good fit. A jump this large is a
  # station step or a bad QDC, not geomagnetic activity.
  max_baseline_drift_nt: 50.0

  # Quiet-time residual RMS ceiling for this station; above it, suspect the
  # sensor rather than the sky (VIC sits near 3-10 nT).
  expected_quiet_rms_max_nt: 30.0

# ---------------------------------------------------------------------------
# Upstream response cache (historical windows only; --live never reads it)
# ---------------------------------------------------------------------------
cache:
  enabled: true
  dir: .magnetometer_cache
  ttl_hours: 24.0

  # Reuse the fitted baseline when only classification settings change
  # (threshold sweeps).
  reuse_baseline: true
