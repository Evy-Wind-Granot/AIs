name: Magnetometer CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r magnetometer/requirements.txt
          pip install -r magnetometer/requirements-dev.txt

      - name: Lint
        run: python -m flake8 magnetometer

      - name: Type check
        run: python -m mypy magnetometer

      - name: Offline tests
        run: |
          python -m unittest discover -s magnetometer/tests -p 'test_*.py'
          python -m unittest discover -s magnetometer/models/tests -p 'test_*.py'

      - name: CLI import smoke test
        run: |
          python -c "from magnetometer.demos import magnetometer_demo, run_magnetometer"
          python -c "from magnetometer.validation.historical import validate_historical_magnetometer"
          python -c "from magnetometer.validation.replay import replay_live_detector"
          python -c "from magnetometer.calibration.historical import calibrate_historical_magnetometer"
          python -c "from magnetometer.calibration.station import calibrate_station"

      - name: Production config smoke test
        run: |
          python - <<'PY'
          from magnetometer.demos import magnetometer_demo as md
          md.load_config("magnetometer/config/pipeline/config.yaml")
          print("production config validated")
          PY
