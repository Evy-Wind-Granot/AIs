name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m flake8 magnetometer test_magnetometer_demo.py run_magnetometer.py magnetometer_demo.py

      - name: Type check
        run: |
          python -m mypy magnetometer_demo.py calibrate_observatory.py \
            calibrate_thresholds.py tune_thresholds.py validate_periods.py \
            run_magnetometer.py test_magnetometer_demo.py magnetometer

      - name: Offline regression tests
        run: python test_magnetometer_demo.py

      - name: CLI import smoke test
        run: python -c "import magnetometer; import magnetometer_demo; import run_magnetometer"
