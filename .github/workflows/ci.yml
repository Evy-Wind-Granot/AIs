name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m flake8 magnetometer \
            test_historical_validation.py test_calibration.py \
            magnetometer/tests/test_magnetometer_acquisition.py \
            magnetometer/tests/test_magnetometer_demo.py \
            magnetometer/models/tests/test_magnetometer_ml.py \
            magnetometer/models/tests/test_magnetometer_ml_real.py \
            magnetometer/calibration/calibrate_historical_magnetometer.py \
            magnetometer/demos/run_magnetometer.py \
            magnetometer/models/train_magnetometer_forecaster.py \
            magnetometer/validation/validate_historical_magnetometer.py

      - name: Type check
        run: |
          python -m mypy magnetometer/demos/magnetometer_demo.py calibrate_observatory.py \
            calibrate_thresholds.py tune_thresholds.py validate_periods.py \
            magnetometer/calibration/calibrate_historical_magnetometer.py \
            magnetometer/demos/run_magnetometer.py \
            magnetometer/validation/validate_historical_magnetometer.py \
            magnetometer/tests/test_magnetometer_demo.py \
            test_historical_validation.py test_calibration.py magnetometer

      - name: Offline regression tests
        run: |
          python magnetometer/tests/test_magnetometer_demo.py
          python test_historical_validation.py
          python test_calibration.py
          python magnetometer/models/tests/test_magnetometer_ml.py
          python -m unittest magnetometer/models/tests/test_magnetometer_ml_real.py
          python -m unittest discover -s magnetometer/models/tests -p 'test_*.py'
          python -m unittest discover -s magnetometer/tests -p 'test_*.py'

      - name: CLI import smoke test
        run: python -c "from magnetometer.demos import magnetometer_demo; from magnetometer.demos import run_magnetometer; from magnetometer.validation import validate_historical_magnetometer; from magnetometer.calibration import calibrate_historical_magnetometer; from magnetometer.models import forecaster"
