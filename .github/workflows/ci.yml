name: Magnetometer CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up repository environment
        run: python run_all_demos.py --setup-main

      - name: Lint
        run: python -m flake8 --max-line-length=100 --exclude=.git,__pycache__,venv,venv_moirai magnetometer

      - name: Type check
        run: python -m mypy --python-version 3.10 --ignore-missing-imports magnetometer

      - name: Offline tests
        run: |
          python -m unittest discover -s magnetometer/tests -p 'test_*.py'
          python -m unittest discover -s magnetometer/models/tests -p 'test_*.py'

      - name: CLI and pipeline smoke test
        run: |
          python -m magnetometer.pipeline.cli --self-test
          python -c "from magnetometer import core; from magnetometer.pipeline import run_analysis; from magnetometer.calibration.historical import calibrate_historical_magnetometer; from magnetometer.validation.historical import validate_historical_magnetometer"

      - name: Production config smoke test
        run: |
          python - <<'PY'
          from magnetometer.pipeline.config import load_config
          load_config("magnetometer/config/pipeline/config.yaml")
          print("production config validated")
          PY
