name: Magnetometer Forecasting Tests

on:
  push:
    paths:
      - 'magnetometer/**'
      - 'tests/**'
      - 'train_magnetometer_forecaster.py'
      - 'train_magnetometer_forecaster_production.py'
      - '.github/workflows/magnetometer-forecasting.yml'
  pull_request:
    paths:
      - 'magnetometer/**'
      - 'tests/**'
      - 'train_magnetometer_forecaster.py'
      - 'train_magnetometer_forecaster_production.py'
      - '.github/workflows/magnetometer-forecasting.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install forecasting dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy pandas scipy requests scikit-learn joblib pytest
      - name: Run forecasting unit tests
        run: python -m pytest -q tests/test_forecast_features.py tests/test_forecaster.py tests/test_hybrid_inference.py tests/test_forecast_release_gate.py tests/test_production_hardening.py tests/test_detector_hardening.py
      - name: Run offline production trainer self-test
        run: python train_magnetometer_forecaster_production.py --self-test
